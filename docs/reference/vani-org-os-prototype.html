<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaNi Org OS — interactive prototype</title>
<style>
:root{
  --bg:#0A0C0D; --bg2:#101315; --surf:#14181A; --surf2:#191E21; --surf3:#1F2529;
  --line:#242B2F; --line2:#2E373C;
  --tx:#E9EDEE; --tx2:#9BA6AB; --tx3:#6B767C;
  --ac:#2DD4BF; --ac-dim:#0F3C38; --ac-line:#1C6D64;
  --gtm:#F59E0B; --dig:#A78BFA; --otc:#60A5FA; --orch:#2DD4BF;
  --ok:#34D399; --warn:#FBBF24; --bad:#FB7185;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- primitives ---------- */
.mono{font-family:var(--mono)}
.addr{font-family:var(--mono);font-size:11.5px;color:var(--ac);
  background:var(--ac-dim);border:1px solid var(--ac-line);border-radius:5px;
  padding:1.5px 6px;display:inline-block;white-space:nowrap}
.addr.plain{color:var(--tx2);background:var(--surf3);border-color:var(--line)}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.btn{background:var(--ac);color:#04211E;font-weight:640;border-radius:8px;
  padding:9px 17px;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--surf2);filter:none}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:20px;background:var(--surf3);color:var(--tx2);
  border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#1B4D3E;background:#0D2B24}
.pill.warn{color:var(--warn);border-color:#4D3F17;background:#2B2410}
.pill.bad{color:var(--bad);border-color:#4D2229;background:#2B1418}
.pill.ac{color:var(--ac);border-color:var(--ac-line);background:var(--ac-dim)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.h2{font-size:16px;font-weight:640;letter-spacing:-.01em}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);font-weight:660}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);
  border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ac-line)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.sep{height:1px;background:var(--line);margin:16px 0}

/* ---------- marketing ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:18px 34px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:rgba(10,12,13,.86);backdrop-filter:blur(12px);z-index:50}
.logo{display:flex;align-items:center;gap:9px;font-weight:660;letter-spacing:-.02em;font-size:15.5px}
.logomark{width:22px;height:22px;border-radius:6px;
  background:linear-gradient(140deg,var(--ac),#0E7C70);flex:none;
  display:flex;align-items:center;justify-content:center;color:#04211E;font-size:11px;font-weight:800}
.hero{max-width:1080px;margin:0 auto;padding:86px 34px 60px;text-align:center}
.hero h1{font-size:48px;line-height:1.08;letter-spacing:-.035em;font-weight:680;
  max-width:17ch;margin:0 auto 20px}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p{font-size:16.5px;color:var(--tx2);max-width:60ch;margin:0 auto 30px;line-height:1.6}
.heroline{display:flex;gap:10px;justify-content:center;margin-bottom:54px}
.stack{max-width:1000px;margin:0 auto;padding:0 34px 80px;display:grid;gap:9px}
.slab{display:grid;grid-template-columns:1fr 116px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surf);overflow:hidden}
.slab.f{border-color:var(--ac-line);background:linear-gradient(180deg,#0E2A28,var(--surf))}
.slab .sb{padding:15px 18px}
.slab h4{font-size:14.5px;font-weight:640;margin-bottom:3px}
.slab.f h4{color:var(--ac)}
.slab p{font-size:12.5px;color:var(--tx2)}
.slab .st{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-weight:660}
.slab.f .st{border-left-color:var(--ac-line);color:var(--ac)}
.feat{max-width:1000px;margin:0 auto;padding:0 34px 90px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feat .card{padding:20px}
.feat h4{font-size:14px;font-weight:640;margin-bottom:6px}
.feat p{font-size:12.5px;color:var(--tx2);line-height:1.6}
.feat .ic{width:30px;height:30px;border-radius:8px;background:var(--ac-dim);
  border:1px solid var(--ac-line);display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;font-size:14px}

/* ---------- auth ---------- */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px}
.authbox{width:100%;max-width:420px}
.authbox .card{padding:28px}
.authhead{text-align:center;margin-bottom:24px}
.authhead h2{font-size:21px;font-weight:650;letter-spacing:-.02em;margin-bottom:6px}
.authhead p{font-size:13px;color:var(--tx2)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--ac)}
.prov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.prov button{border:1px solid var(--line2);border-radius:8px;padding:13px 8px;
  font-size:12.5px;font-weight:600;color:var(--tx2);background:var(--bg2);transition:.15s}
.prov button:hover{border-color:var(--line2);color:var(--tx)}
.prov button.on{border-color:var(--ac-line);background:var(--ac-dim);color:var(--ac)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.orgpick{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--line);margin-bottom:16px}
.orgpick .av{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--ac),#0E7C70);
  display:flex;align-items:center;justify-content:center;color:#04211E;font-weight:800;font-size:11px;flex:none}
.orgpick b{font-size:13px;font-weight:620;display:block;line-height:1.25}
.orgpick small{font-size:10.5px;color:var(--tx3);font-family:var(--mono)}
.nvlbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:660;padding:14px 10px 5px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  font-size:13px;color:var(--tx2);transition:.12s;cursor:pointer}
.nv:hover{background:var(--surf2);color:var(--tx)}
.nv.on{background:var(--surf3);color:var(--tx);font-weight:600}
.nv .ic{width:16px;text-align:center;font-size:13px;flex:none}
.nv .bdg{margin-left:auto;font-size:10px;background:var(--ac-dim);color:var(--ac);
  border:1px solid var(--ac-line);border-radius:10px;padding:0 6px;font-weight:700}
.main{padding:26px 32px 60px;max-width:1180px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.phead p{font-size:13px;color:var(--tx2);margin-top:5px;max-width:70ch}

/* ---------- generic app bits ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{padding:15px 16px}
.stat b{display:block;font-size:25px;font-weight:660;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:11.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:620}
.stat i{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);font-weight:660;padding:0 12px 9px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--surf2)}
.sect{margin-bottom:26px}
.sect>h3{font-size:13.5px;font-weight:640;margin-bottom:11px;display:flex;
  align-items:center;justify-content:between;gap:8px}
.empty{padding:34px;text-align:center;color:var(--tx3);font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{padding:9px 14px;font-size:13px;color:var(--tx2);border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:.12s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.bar{height:5px;background:var(--surf3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .5s}

/* ---------- object workspace ---------- */
.sugg{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:9px;
  background:var(--surf2);border:1px solid var(--line);margin-bottom:8px}
.sugg .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:13px;flex:none}
.contrib{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:6px}
.jrow{display:flex;gap:0;overflow-x:auto;padding:4px 0 10px}
.jstage{flex:1 0 178px;min-width:178px;border:1px solid var(--line);border-radius:10px;
  background:var(--surf);padding:13px;margin-right:10px;position:relative}
.jstage:last-child{margin-right:0}
.jstage.on{border-color:var(--gtm);background:linear-gradient(180deg,#2A1F0C,var(--surf))}
.jstage.past{opacity:.62}
.jstage h5{font-size:12.5px;font-weight:640;margin-bottom:2px}
.jstage .rule{font-size:10.5px;color:var(--tx3);line-height:1.45;margin-bottom:10px;min-height:30px}
.jact{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 7px;border-radius:6px;
  background:var(--bg2);border:1px solid var(--line);margin-bottom:5px}
.jact .ch{width:14px;text-align:center;flex:none;font-size:11px}
.jact .stt{margin-left:auto;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.jconn{position:absolute;right:-11px;top:50%;color:var(--line2);font-size:12px;z-index:2}
.tl{position:relative;padding-left:20px}
.tl:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:9px 0}
.tli:before{content:'';position:absolute;left:-18px;top:15px;width:7px;height:7px;border-radius:50%;
  background:var(--surf);border:1.5px solid var(--line2)}
.tli.hot:before{background:var(--gtm);border-color:var(--gtm)}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
  .g3,.g4,.feat{grid-template-columns:1fr 1fr}
  .hero h1{font-size:34px}
  .main{padding:20px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   VaNi Org OS — prototype state
   ========================================================= */
const S = {
  screen:'landing', org:'Vikuna Technologies', slug:'vikuna',
  provider:'anthropic', signupStep:0,
  profileStep:0, profileDone:false,
  knowledge:[
    {id:1,name:'Vikuna Services Catalogue.pdf',kind:'pdf',facts:47,status:'done',src:'upload'},
    {id:2,name:'contacts_master.csv',kind:'csv',facts:312,status:'done',src:'upload'},
    {id:3,name:'HubSpot CRM',kind:'api',facts:1840,status:'live',src:'connector'},
    {id:4,name:'Sriveda MSA 2026.pdf',kind:'pdf',facts:63,status:'done',src:'upload'}
  ],
  kgFilter:'all', kgNode:'acc-sriveda',
  agentTab:'overview', openRun:null, approved:false, toast:null
};

const AGENTS = [
  {id:'orchestrator',name:'Dean',role:'Org Orchestrator',color:'#2DD4BF',icon:'◉',
   scope:'org://vikuna/**',status:'active',runs:184,tools:4,facts:'—',
   desc:'Thin router. Intake, resolve, route, policy, close. Owns no domain reasoning.'},
  {id:'gtm',name:'Aria',role:'GTM Agent',color:'#F59E0B',icon:'▲',
   scope:'org://vikuna/accounts/** · contacts/**',status:'active',runs:96,tools:11,facts:2140,
   desc:'Journey-stage acquisition and LTV. Owns nurture, outreach, stage movement.'},
  {id:'digital',name:'Nova',role:'Digital Agent',color:'#A78BFA',icon:'◆',
   scope:'org://vikuna/web/** · content/**',status:'active',runs:71,tools:9,facts:880,
   desc:'Digital estate — site, content, SEO, analytics. Reports drift against brand policy.'},
  {id:'otc',name:'Ledger',role:'Order-to-Cash Agent',color:'#60A5FA',icon:'■',
   scope:'org://vikuna/orders/** · invoices/**',status:'attention',runs:53,tools:8,facts:1290,
   desc:'Quote to cash. Order validation, invoicing, dunning, collections reconciliation.'}
];

const money = n => '₹' + n.toLocaleString('en-IN');
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function go(screen,extra){ Object.assign(S,{screen},extra||{}); window.scrollTo(0,0); render(); }
function toast(msg){ S.toast=msg; render(); setTimeout(()=>{S.toast=null;render();},2200); }

/* =========================================================
   MARKETING + AUTH
   ========================================================= */
function vLanding(){
  return `
  <div class="nav">
    <div class="logo"><div class="logomark">V</div> VaNi <span class="dim" style="font-weight:500">Org OS</span></div>
    <div class="row">
      <button class="btn ghost sm" data-go="login">Log in</button>
      <button class="btn sm" data-go="signup">Create organization</button>
    </div>
  </div>

  <div class="hero">
    <h1>Your organization, <em>addressable</em>.</h1>
    <p>Not another automation tool. A context layer for your whole organization — every person,
    document, deal and system given one stable address — and a team of agents that work on top of it.
    Deployed inside your own cloud.</p>
    <div class="heroline">
      <button class="btn" data-go="signup">Create your organization</button>
      <button class="btn ghost" data-go="login">See the demo org</button>
    </div>
  </div>

  <div class="stack">
    <div class="slab"><div class="sb"><h4>Agents</h4>
      <p>Orchestrator plus domain agents — GTM, Digital, Order-to-Cash. They pass addresses, never prose.</p></div>
      <div class="st">Layer 4</div></div>
    <div class="slab"><div class="sb"><h4>Organization model</h4>
      <p>Units, roles, objectives, policies — grown from evidence, never designed up front.</p></div>
      <div class="st">Layer 3</div></div>
    <div class="slab"><div class="sb"><h4>Ingest &amp; act</h4>
      <p>Ingesters turn systems, PDFs and CSVs into facts. Tools act on addresses. No agent calls an API directly.</p></div>
      <div class="st">Layer 2</div></div>
    <div class="slab f"><div class="sb"><h4>Foundation — namespace, facts, permissions</h4>
      <p>Every reference resolves to one address. Every fact carries provenance, valid time and confidence.
      Permissions attach to the address tree; agents inherit them.</p></div>
      <div class="st">Core</div></div>
  </div>

  <div class="feat">
    <div class="card"><div class="ic">⌘</div><h4>Unified namespace</h4>
      <p>An email, a CRM row and a CSV column describing the same company resolve to one address —
      reversibly, with an audit trail.</p></div>
    <div class="card"><div class="ic">◈</div><h4>Contextual memory</h4>
      <p>Facts, not records. Each one knows where it came from, when it was true, and how confident we are.</p></div>
    <div class="card"><div class="ic">⎔</div><h4>Your cloud, your model</h4>
      <p>Runs in your VPC. Connect your own Claude, OpenAI or in-house model. Nothing leaves your perimeter.</p></div>
  </div>`;
}

function vLogin(){
  return `<div class="authwrap"><div class="authbox">
    <div class="authhead">
      <div class="logo" style="justify-content:center;margin-bottom:16px"><div class="logomark">V</div> VaNi Org OS</div>
      <h2>Welcome back</h2><p>Sign in to ${esc(S.org)}</p>
    </div>
    <div class="card">
      <label class="field"><span>Work email</span><input id="li-email" value="charan@vikuna.io"></label>
      <label class="field"><span>Password</span><input type="password" value="demo-password"></label>
      <button class="btn" style="width:100%" data-go="dashboard">Sign in</button>
      <div class="sep"></div>
      <div style="text-align:center;font-size:12.5px" class="muted">
        No organization yet? <a data-go="signup" style="color:var(--ac);cursor:pointer">Create one</a>
      </div>
    </div>
    <div style="text-align:center;margin-top:16px"><button class="btn ghost sm" data-go="landing">← Back</button></div>
  </div></div>`;
}

function vSignup(){
  const st=S.signupStep;
  const provs=[['anthropic','Claude'],['openai','OpenAI'],['local','In-house']];
  let body='';
  if(st===0){ body=`
    <label class="field"><span>Organization name</span><input id="su-org" value="${esc(S.org)}"></label>
    <label class="field"><span>Namespace slug</span>
      <input id="su-slug" value="${esc(S.slug)}">
      <small class="dim mono" style="font-size:11px;display:block;margin-top:6px">
        every object will live under org://${esc(S.slug)}/…</small></label>
    <label class="field"><span>Industry</span><select>
      <option>Technology &amp; consulting</option><option>Manufacturing</option>
      <option>Pharma &amp; life sciences</option><option>Financial services</option></select></label>
    <button class="btn" style="width:100%" data-act="su-next">Continue</button>`;
  } else if(st===1){ body=`
    <div class="lbl" style="margin-bottom:9px">Bring your own model</div>
    <p class="muted" style="font-size:12.5px;margin-bottom:14px">
      VaNi never ships a model. Connect the provider you already have a contract with —
      keys stay in your VPC.</p>
    <div class="prov">${provs.map(([k,n])=>
      `<button class="${S.provider===k?'on':''}" data-act="prov" data-v="${k}">${n}</button>`).join('')}</div>
    <label class="field"><span>API key</span><input type="password" value="sk-••••••••••••••••••••"></label>
    <div class="card" style="padding:12px;background:var(--bg2);margin-bottom:14px">
      <div class="lbl" style="margin-bottom:8px">Model tier by agent role</div>
      <div class="row" style="justify-content:space-between;font-size:12.5px;margin-bottom:6px">
        <span class="muted">Orchestrator &amp; planning</span><span class="pill ac">strong</span></div>
      <div class="row" style="justify-content:space-between;font-size:12.5px;margin-bottom:6px">
        <span class="muted">Extraction &amp; classification</span><span class="pill">cheap</span></div>
      <div class="row" style="justify-content:space-between;font-size:12.5px">
        <span class="muted">Embeddings</span><span class="pill">cheap</span></div>
    </div>
    <button class="btn" style="width:100%" data-act="su-next">Continue</button>`;
  } else { body=`
    <div class="lbl" style="margin-bottom:9px">Deployment target</div>
    <p class="muted" style="font-size:12.5px;margin-bottom:14px">
      One container image. It runs where your data already lives.</p>
    <label class="field"><span>Environment</span><select>
      <option>AWS — your VPC (ap-south-1)</option><option>Azure — your subscription</option>
      <option>GCP — your project</option><option>Self-managed Kubernetes</option></select></label>
    <label class="field"><span>Postgres</span><select>
      <option>Provision new (recommended)</option><option>Use existing instance</option></select></label>
    <div class="card" style="padding:12px 13px;background:var(--bg2);margin-bottom:15px">
      <div class="row" style="gap:8px;font-size:12.5px"><span class="pill ok"><i class="dot"></i>ready</span>
        <span class="muted">Install is scripted — one command, ~6 minutes.</span></div>
    </div>
    <button class="btn" style="width:100%" data-go="profile">Create organization</button>`;
  }
  return `<div class="authwrap"><div class="authbox">
    <div class="authhead">

function pKG(){
  const f=S.kgFilter, sel=NODES[S.kgNode]?S.kgNode:'acc-sriveda';
  const on = k => f==='all'||NODES[k].t===f;
  const edges = EDGES.map(([a,b,l])=>{
    const A=NODES[a],B=NODES[b], live=on(a)&&on(b);
    const hot = a===sel||b===sel;
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"
      stroke="${hot?'var(--ac)':'#2E373C'}" stroke-width="${hot?1.6:1}"
      opacity="${live?(hot?.95:.5):.08}"/>`;
  }).join('');
  const nodes = Object.entries(NODES).map(([k,n])=>{
    const c=KTYPES[n.t][1], live=on(k), isSel=k===sel;
    return `<g class="kgn" data-act="kgnode" data-v="${k}" style="cursor:pointer;opacity:${live?1:.16}">
      <circle cx="${n.x}" cy="${n.y}" r="${n.r+7}" fill="${c}" opacity="${isSel?.22:0}"/>
      <circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${c}1F" stroke="${c}"
        stroke-width="${isSel?2.2:1.2}"/>
      <text x="${n.x}" y="${n.y+n.r+14}" text-anchor="middle" fill="${isSel?'#E9EDEE':'#9BA6AB'}"
        font-size="10.5" font-weight="${isSel?700:500}">${n.lbl}</text></g>`;
  }).join('');

  const facts = NODEFACTS[sel]||DEFFACTS;
  const nbrs = EDGES.filter(([a,b])=>a===sel||b===sel)
    .map(([a,b,l])=>[l, a===sel?b:a, a===sel?'→':'←']);

  return `
  <div class="phead">
    <div><div class="h1">Knowledge Graph</div>
      <p>Five graphs, one substrate. Same nodes, different edge types — entity, structure, behaviour,
      knowledge and capability. Click any node to see its facts and where each one came from.</p></div>
  </div>

  <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">
    <button class="pill ${f==='all'?'ac':''}" data-act="kgf" data-v="all"
      style="cursor:pointer">All ${Object.keys(NODES).length}</button>
    ${Object.entries(KTYPES).map(([k,[n,c]])=>`
      <button class="pill ${f===k?'ac':''}" data-act="kgf" data-v="${k}" style="cursor:pointer">
        <i class="dot" style="background:${c}"></i>${n}</button>`).join('')}
  </div>

  <div class="grid" style="grid-template-columns:1.5fr 1fr;align-items:start">
    <div class="card" style="padding:6px;overflow:hidden">
      <svg viewBox="0 0 720 470" style="width:100%;height:auto;display:block">
        ${edges}${nodes}
      </svg>
    </div>
    <div class="card" style="padding:17px;position:sticky;top:22px">
      <div class="lbl" style="margin-bottom:7px">${NODES[sel].kind}</div>
      <div class="h2" style="margin-bottom:8px">${NODES[sel].lbl}</div>
      <div class="addr" style="margin-bottom:15px;white-space:normal">${NODES[sel].addr}</div>

      <div class="lbl" style="margin-bottom:8px">Facts &amp; provenance</div>
      ${facts.map(x=>`
        <div style="padding:9px 0;border-bottom:1px solid var(--line)">
          <div class="row" style="gap:7px;align-items:baseline;margin-bottom:3px">
            <span class="mono dim" style="font-size:11.5px">${x[0]}</span>
            <span style="color:var(--line2)">→</span>
            <span style="font-size:12.5px;font-weight:560">${x[1]}</span></div>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <span class="pill" style="font-size:10px">${x[2]}</span>
            <span class="pill ${+x[3]>=.9?'ok':+x[3]>=.7?'warn':'bad'}" style="font-size:10px">
              conf ${x[3]}</span>
            <span class="dim" style="font-size:10px">${x[4]}</span></div>
        </div>`).join('')}

      <div class="lbl" style="margin:15px 0 8px">Connections</div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        ${nbrs.map(([l,k,d])=>`<button class="pill" data-act="kgnode" data-v="${k}"
          style="cursor:pointer"><span class="dim">${d} ${l}</span> ${NODES[k].lbl}</button>`).join('')}
      </div>

      <div class="lbl" style="margin:15px 0 8px">Who can see this</div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <span class="pill ac">Dean</span>
        ${sel.startsWith('inv')||sel.startsWith('ord')?'<span class="pill">Ledger</span>':'<span class="pill">Aria</span>'}

    </div>
  </div>`;

        </div>
      </div>

      <div class="card" style="padding:18px;position:sticky;top:22px">
        <div class="lbl" style="margin-bottom:12px">This cycle</div>
        <div style="margin-bottom:14px">
          <div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">
            <span class="muted" style="font-size:12.5px">Base</span><b class="mono">${p.mtd}</b></div>
          <div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">
            <span class="muted" style="font-size:12.5px">Variable</span><b class="mono">${p.var}</b></div>
          <div class="row" style="justify-content:space-between;padding:11px 0">
            <span style="font-size:13px;font-weight:620">VaNi total</span>
            <b class="mono" style="font-size:15px;color:var(--ac)">${
              p.var==='₹0'?p.mtd:'₹30,399'}</b></div>
        </div>
        <div class="card" style="padding:12px 13px;background:var(--bg2)">
          <div class="lbl" style="margin-bottom:6px">Model spend — not billed by VaNi</div>
          <div class="row" style="justify-content:space-between">
            <span class="muted" style="font-size:12.5px">${a.name}'s tokens</span>
            <b class="mono">₹${a.id==='gtm'?'186':a.id==='digital'?'142':'84'}</b></div>
          <div class="dim" style="font-size:11px;margin-top:6px">
            Charged directly to your ${S.provider==='anthropic'?'Anthropic':S.provider==='openai'?'OpenAI':'in-house'}
            account. VaNi never resells tokens — no margin, no markup, no lock-in.</div>
        </div>
        <div class="sep"></div>
        <div class="lbl" style="margin-bottom:8px">Change plan</div>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          ${['Outcome','Subscription','Value-share','Per-seat'].map(m=>`
            <button class="pill ${p.model.startsWith(m.slice(0,5))?'ac':''}"
              style="cursor:pointer" data-act="plan" data-v="${m}">${m}</button>`).join('')}
        </div>
        <div class="dim" style="font-size:11px;margin-top:9px">
          Pricing model is configuration on the agent — not a code change, not a redeploy.</div>
      </div>
    </div>`;
  } else { body = runTable(); }
  return head+body;
}

/* =========================================================
   RUNS + TRACE
   ========================================================= */
const RUNS=[
  ['run_8f3a91','otc','Issue credit note · Sriveda','waiting','4/6','₹1.20','2m'],
  ['run_8f3a72','otc','Dunning · INV-2291','waiting','3/5','₹0.80','14m'],
  ['run_8f3a55','digital','Brand drift sweep','done','6/6','₹2.40','38m'],
  ['run_8f3a40','orchestrator','Renewal pack · ContractNest','done','8/8','₹4.10','1h'],
  ['run_8f39e8','gtm','Ingest + resolve · HubSpot','done','5/5','₹0.60','2h'],
  ['run_8f39c1','gtm','Nurture sequence · 12 contacts','failed','2/5','₹0.30','3h']
];
function runTable(){
  return `<div class="card" style="padding:6px 10px">
    <table class="tbl">
      <thead><tr><th>Run</th><th>Agent</th><th>Outcome</th><th>Status</th><th>Steps</th><th>Cost</th><th></th></tr></thead>
      <tbody>${RUNS.map(r=>{const a=agentBy(r[1]);return `
        <tr class="clk" data-go="run"><td><span class="mono" style="font-size:12px;color:var(--ac)">${r[0]}</span></td>
        <td><span style="color:${a.color}">${a.icon}</span> <span class="muted">${a.name}</span></td>
        <td>${r[2]}</td>
        <td><span class="pill ${r[3]==='done'?'ok':r[3]==='failed'?'bad':'warn'}"><i class="dot"></i>${r[3]}</span></td>
        <td class="mono dim">${r[4]}</td><td class="mono dim">${r[5]}</td>
        <td class="dim" style="text-align:right">${r[6]}</td></tr>`}).join('')}
      </tbody></table></div>`;
}
function pRuns(){
  return `<div class="phead"><div><div class="h1">Runs &amp; traces</div>
    <p>Every job leaves a trace. Each run cites the addresses it read and wrote, the tools it called,
    and what it cost — on your own model key.</p></div></div>${runTable()}`;
}

function pRun(){
  const ap=S.approved;
  const steps=[
    ['1','Entitlement gate','Dean','done',`<b>Ledger</b> is entitled — value-share plan, floor paid,
      no outstanding platform invoice. Metered against
      <span class="addr plain">entitlements/ledger</span>. Run may proceed.`,'pricing gateway · 0 tok'],
    ['2','Intake','Dean','done',`Parsed “issue a credit note for the Sriveda overbilling”.
      Resolved subject → <span class="addr">accounts/sriveda</span>`,'claude-opus · 1.4k tok'],
    ['3','Resolve','Dean','done',`Matched 1 open order <span class="addr">orders/ord-118</span>
      and 1 invoice <span class="addr">invoices/inv-2291</span>. No ambiguity.`,'resolver · 0 tok'],
    ['4','Route','Dean','done',`Capability query: who can act on <span class="addr plain">invoices/*</span>?
      → <b>Ledger</b>. Handed off by address.`,'capability graph'],
    ['5','Compute','Ledger','done',`Read 11 facts. Billed ₹4,50,000 against contracted ₹4,20,000
      (MSA p.4 §3.2, conf 0.96). Delta <b>₹30,000</b>… widened to full re-issue: <b>₹4,20,000</b>.`,'claude-sonnet · 6.2k tok'],
    ['6','Approval gate','Ledger',ap?'done':'waiting',
      `Policy <span class="addr plain">policy/credit</span> — credit note above ₹1,00,000 requires a human.
      ${ap?'Approved by charan@vikuna.io.':'<b style="color:var(--warn)">Blocked, waiting on you.</b>'}`,'policy engine'],
    ['7','Issue','Ledger',ap?'done':'blocked',
      ap?`Credit note <b>CN-0042</b> raised in Razorpay. 3 facts written back to the graph.
        Meter updated — this run is not billable, no collection recovered.`
        :'Not started — gated by step 6.','tool: credit_note.issue']
  ];
  return `
  <div class="phead">
    <div><div class="row" style="gap:10px;align-items:baseline">
        <span class="h1">Issue credit note</span>
        <span class="mono" style="color:var(--ac);font-size:13px">run_8f3a91</span></div>
      <p>Triggered by Charan · routed by Dean · executed by Ledger · ${ap?'completed':'waiting on approval'}</p></div>
    <button class="btn ghost" data-go="runs">← All runs</button>
  </div>

  <div class="grid g4 sect">
    <div class="card stat"><span>Status</span><b style="font-size:17px;color:${ap?'var(--ok)':'var(--warn)'}">
      ${ap?'Completed':'Waiting'}</b></div>
    <div class="card stat"><span>Steps</span><b>${ap?'7/7':'5/7'}</b></div>
    <div class="card stat"><span>Model cost</span><b>₹1.20</b><span class="dim" style="text-transform:none;letter-spacing:0"> your key</span></div>
    <div class="card stat"><span>Facts touched</span><b>${ap?'14':'11'}</b></div>
  </div>

  <div class="card" style="padding:8px 4px">
    ${steps.map(s=>`
      <div class="row" style="gap:13px;align-items:flex-start;padding:13px 16px;
        border-bottom:1px solid var(--line)">
        <div style="width:24px;height:24px;border-radius:50%;flex:none;display:flex;
          align-items:center;justify-content:center;font-size:11px;font-weight:700;
          background:${s[3]==='done'?'#0D2B24':s[3]==='waiting'?'#2B2410':'var(--surf3)'};
          border:1px solid ${s[3]==='done'?'#1B4D3E':s[3]==='waiting'?'#4D3F17':'var(--line)'};
          color:${s[3]==='done'?'var(--ok)':s[3]==='waiting'?'var(--warn)':'var(--tx3)'}">
          ${s[3]==='done'?'✓':s[0]}</div>
        <div class="grow">
          <div class="row" style="gap:8px;margin-bottom:4px">
            <b style="font-size:13.5px">${s[1]}</b>
            <span class="pill" style="font-size:10px">${s[2]}</span>
            <span class="pill ${s[3]==='done'?'ok':s[3]==='waiting'?'warn':''}" style="font-size:10px">${s[3]}</span>
          </div>
          <div class="muted" style="font-size:12.5px;line-height:1.6">${s[4]}</div>
          <div class="dim mono" style="font-size:10.5px;margin-top:5px">${s[5]}</div>
        </div>
      </div>`).join('')}
    ${!ap?`
      <div style="padding:16px;background:var(--surf2);margin:4px;border-radius:8px">
        <div class="row" style="gap:12px">
          <div class="grow">

            <div class="muted" style="font-size:12.5px;margin-top:3px">
              Ledger will issue CN-0042 in Razorpay and write 3 facts back to the graph.</div></div>
          <button class="btn ghost sm" data-act="reject">Reject</button>
          <button class="btn sm" data-act="approve">Approve</button>
        </div>
      </div>`:`
      <div style="padding:15px 16px">
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <span class="pill ok"><i class="dot"></i>closed clean</span>
          <span class="dim" style="font-size:12px">Outcome fed to Ledger's eval set — this path is now
          a candidate for crystallisation into a playbook.</span></div>
      </div>`}
  </div>`;
}

/* =========================================================
   ROUTER
   ========================================================= */
const MARKETING = ['landing','login','signup'];
function render(){
  const app = el('app');
  let html='';
  if(S.screen==='landing') html=vLanding();
  else if(S.screen==='login') html=vLogin();
  else if(S.screen==='signup') html=vSignup();
  else html=vApp();
  if(S.toast) html += `<div style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--surf3);border:1px solid var(--ac-line);color:var(--ac);padding:10px 18px;
    border-radius:9px;font-size:13px;font-weight:600;z-index:99;box-shadow:0 8px 30px #0008">
    ${esc(S.toast)}</div>`;
  app.innerHTML = html;
}

document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g){ handleGo(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if(a){ handleAct(a.dataset.act, a.dataset); return; }
});

function handleGo(to){
  if(to==='signup'){ S.signupStep=0; }
  if(to==='profile'){ S.profileStep=0; S.profileDone=false; }
  if(to==='dashboard'){ S.profileDone=true; }
  go(to);
}

function handleAct(act,d){
  switch(act){
    case 'su-next':
      if(S.signupStep===0){
        const o=el('su-org'), s=el('su-slug');
        if(o&&o.value.trim()) S.org=o.value.trim();
        if(s&&s.value.trim()) S.slug=s.value.trim().toLowerCase().replace(/\s+/g,'-');
      }
      S.signupStep=Math.min(2,S.signupStep+1); render(); break;
    case 'su-back':
      if(S.signupStep===0) go('landing'); else { S.signupStep--; render(); } break;
    case 'prov': S.provider=d.v; render(); break;
    default: appAct(act,d);
  }
}
function appAct(act,d){
  switch(act){
    case 'prof-next':{
      const t=el('prof-a'); if(t) QA[S.profileStep].a = t.value.trim()||QA[S.profileStep].a;
      S.profileStep++; render();
      if(S.profileStep>=QA.length) toast('Organization profile written to the graph');
      break;
    }
    case 'prof-reset': S.profileStep=0; render(); break;
    case 'atab': S.agentTab=d.v; render(); break;
    case 'acctab': S.acctTab=d.v; render(); break;
    case 'accept': toast('Accepted — Aria moved the account and logged run_8f3ab2'); break;
    case 'dismiss': toast('Dismissed — Aria will not re-suggest this for 14 days'); break;
    case 'noop': toast('Demo uses Sriveda — open that one'); break;
    case 'kgf': S.kgFilter=d.v; render(); break;
    case 'kgnode': S.kgNode=d.v; render(); break;
    case 'approve': S.approved=true; render(); toast('Approved — Ledger issued CN-0042'); break;
    case 'reject': toast('Rejected — Ledger notified, run closed'); break;
    case 'ask': toast('Dean: routing to Aria and Ledger…'); break;
    case 'hire': go('market'); break;
    case 'subscribe': toast(d.v+' entitled — tools registered, routing updated'); break;
    case 'plan': toast('Pricing model changed to '+d.v+' — config only, no redeploy'); break;
    case 'ingest':{
      S.ingest={stage:0}; render();
      const tick=()=>{ if(!S.ingest) return;
        if(S.ingest.stage<4){ S.ingest.stage++; render(); setTimeout(tick,850); }
        else toast('63 facts written · 1 conflict flagged'); };
      setTimeout(tick,700); break;
    }
  }
}

render();
</script>
