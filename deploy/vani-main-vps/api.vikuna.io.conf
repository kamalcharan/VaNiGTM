# ============================================================
# VaNi AI — Nginx site config for api.vikuna.io
#
# ALLOWLIST ONLY. This backend also serves every other VaNiGTM skill
# (contact-skill, campaign-skill, ingestion-skill, the GTM product's OWN
# "vani-skill" onboarding agent at /api/v1/vani — note the name collision
# with "VaNi AI," they are unrelated products sharing one Express process)
# — none of that belongs on a public internet-facing host. Only three
# path groups are proxied; everything else 404s at nginx, before it ever
# reaches the backend.
#
# GUESSED, confirm before applying — see RUNBOOK.md "What I had to guess":
#   - Drop-in location: assumes vikuna-nginx is a standard nginx:alpine
#     container with `include /etc/nginx/conf.d/*.conf;` in its main
#     nginx.conf, and that some host directory is bind-mounted to that
#     container's /etc/nginx/conf.d/. Put this file there; if vikuna-nginx
#     is configured differently, adapt the drop-in path, not the content.
#   - SSL: no cert exists yet for api.vikuna.io (CLAUDE.md noted "no SSL yet
#     on Nginx" as of the last inspection). This file is HTTP-only (port
#     80); the commented block at the bottom is the standard certbot
#     --nginx result to uncomment once DNS (api.vikuna.io -> VPS IP) and a
#     cert exist. Both are prerequisites outside Docker/this file's scope.
#   - Vercel preview origin pattern: guessed as
#     https://vikunawebsite-<anything>.vercel.app (Vercel's default is
#     <project-name>-<hash>-<team>.vercel.app, and the project name is very
#     likely "vikunawebsite" since that's this repo's actual name) — narrow
#     or widen the regex once you confirm the exact Vercel project slug.
# ============================================================

upstream vani_backend {
    server vani-backend:3001;
    keepalive 32;
}

# Dynamic CORS origin allowlist. $cors_origin is empty (no CORS headers
# added) for any Origin that doesn't match — the correct secure default is
# to omit the header, not to echo back an unapproved origin.
map $http_origin $cors_origin {
    default                                                "";
    "~^https://(www\.)?vikuna\.io$"                        "$http_origin";
    "~^https://vikunawebsite(-[a-zA-Z0-9-]+)?\.vercel\.app$" "$http_origin";
}

server {
    listen 80;
    server_name api.vikuna.io;

    access_log /var/log/nginx/vani_access.log;
    error_log  /var/log/nginx/vani_error.log warn;

    proxy_connect_timeout 60s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Everything not explicitly allowlisted below falls through to this —
    # nginx's default is to fall to the last matching location, and no
    # `location /` is defined, so unmatched paths return nginx's own 404
    # without ever proxying to the backend.

    # ── Health check ──────────────────────────────────────
    location = /health {
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Anonymous assessment routes (no auth) ─────────────
    location /api/v1/assessment/ {
        include /etc/nginx/snippets/vani-cors.conf;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Console: assessment-skill executor ONLY (JWT-gated in Express) ───
    # Deliberately NOT `/api/v1/skills/` — that would also expose every
    # other skill's executor path (contact-skill, campaign-skill, ...) on
    # this public host. Only this one skill name is allowlisted.
    location ~ ^/api/v1/skills/assessment-skill/ {
        include /etc/nginx/snippets/vani-cors.conf;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Auth (console login/refresh — owner/partner accounts) ─────────────
    location /api/v1/auth/ {
        include /etc/nginx/snippets/vani-cors.conf;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

