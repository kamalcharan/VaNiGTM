# ============================================================
# api.vikuna.io — the LIVE nginx site config for the VaNi API.
#
# This file is a copy of what runs on the Main VPS, taken from the box on
# 2026-09-30 (`cat` of the file below). Edit it HERE first, then copy it over;
# the repo copy had drifted to 3 of 9 locations before that, which is how the
# console's /skills, /vara, /etl and /embed calls came to 404 in production.
#
#   host : /opt/vikuna/docker/docker/config/nginx/conf.d/api.vikuna.io.conf
#   in   : vikuna-nginx:/etc/nginx/conf.d/api.vikuna.io.conf
#   with : vani-cors.inc (same directory — .inc, NOT .conf: nginx.conf includes
#          conf.d/*.conf, so a .conf there loads as a top-level block and fails)
#
#   cp deploy/vani-main-vps/api.vikuna.io.conf deploy/vani-main-vps/vani-cors.inc \
#      /opt/vikuna/docker/docker/config/nginx/conf.d/
#   docker exec vikuna-nginx nginx -t && docker exec vikuna-nginx nginx -s reload
#
# ── Exposure, stated honestly ──────────────────────────────────────────────
# This started as ALLOWLIST ONLY (assessment + auth). That stopped being the
# design when the console began calling the API directly from the browser:
# vani.vikuna.io → api.vikuna.io, every skill, credentials included. So the
# catch-all `location /api/v1/` below proxies the whole API. What protects it
# is the application, not nginx: every route checks the JWT (verified
# 2026-09-30 — etl 14/14, vara 7/7, llm-provider 5/5, storyteller 5/5 + the
# skill executor) EXCEPT these, public by design:
#   POST /api/v1/embed/boot, /embed/intent   the widget inside a tenant's site
#   POST /api/v1/funnel/site, GET /funnel/site/:token   website preview before signup
#        (rate-limited per IP; the SSRF guard is in src/funnel/site.ts; /funnel/claim needs a JWT)
#   GET  /api/v1/storyteller/share/:token    a shared deck
# plus /api/v1/assessment/* (the public assessment funnel). A new public
# route is a decision, and belongs in this list.
#
# The named locations above the catch-all are kept for their timeouts and
# because they predate it; longest prefix wins, so they behave as before.
# ============================================================

upstream vani_backend {
    server vani-backend:3001;
    keepalive 32;
}

# Dynamic CORS origin allowlist. $cors_origin is empty (no CORS headers
# added) for any Origin that doesn't match — the secure default is to omit
# the header, not to echo back an unapproved origin. Exact hosts only; this
# is what the API's own CORS_ORIGIN would say, and nginx is where it is
# enforced in production (the container's CORS_ORIGIN is unset there).
map $http_origin $cors_origin {
    default                                             "";
    "~^https://(www\.)?vikuna\.io$"                     "$http_origin";
    "~^https://vani\.vikuna\.io$"                       "$http_origin";
    "~^https://vani-app(-[a-zA-Z0-9-]+)?\.vercel\.app$" "$http_origin";
}

server {
    listen 80;
    listen [::]:80;
    server_name api.vikuna.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.vikuna.io;

    ssl_certificate     /etc/letsencrypt/live/api.vikuna.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vikuna.io/privkey.pem;

    access_log /var/log/nginx/vani_access.log;
    error_log  /var/log/nginx/vani_error.log warn;

    client_max_body_size 2m;
    proxy_connect_timeout 60s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    location = /health {
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/v1/assessment/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/skills/assessment-skill/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/onboarding/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/tenant/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mission wizard: Smart Profile step 1. 300s because research and brand
    # generation call the LLM inside the request and LLM_PRIMARY_TIMEOUT_MS is
    # 280s — nginx's 60s default would cut a request the backend completes.
    location /api/v1/ingest/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/v1/profile/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/v1/vani/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else the console and the embed widget call: /skills, /vara,
    # /etl, /embed, /llm-provider, /storyteller. More specific locations above
    # still win (longest prefix). 300s: skill calls may run the LLM in-request.
    # Added 2026-09-30 — before it, all of those answered nginx's 404.
    location /api/v1/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
