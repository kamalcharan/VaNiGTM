# ============================================================
# VaNi AI — CORS snippet, included by the three allowlisted locations in
# api.vikuna.io.conf. Deploy alongside it — see that file's header comment
# for the assumed drop-in path (/etc/nginx/snippets/ here; adjust both
# paths together if vikuna-nginx's actual layout differs).
#
# $cors_origin comes from api.vikuna.io.conf's map block — empty for any
# Origin not on the allowlist, in which case no CORS header is added at all
# (the secure default: browsers block the response, nginx doesn't need an
# explicit deny).
#
# Access-Control-Allow-Credentials is set because the existing Express
# cors() config already uses `credentials: true` (httpOnly cookie exchange
# for refresh tokens, per server.ts) — when credentials are involved,
# Access-Control-Allow-Origin can never be "*", it must echo the specific
# validated origin, which is exactly what $cors_origin does.
# ============================================================

add_header 'Access-Control-Allow-Origin' $cors_origin always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Vary' 'Origin' always;

if ($request_method = 'OPTIONS') {
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Max-Age' 86400;
    add_header 'Content-Length' 0;
    add_header 'Content-Type' 'text/plain';
    return 204;
}
