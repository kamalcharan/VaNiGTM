<!DOCTYPE html>

            padding: 0;

        }
        
        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 48px;

        }
        
        h1 {

            font-weight: 800;
            color: #2D3748;

        }
        
        p {
            color: #718096;
            font-size: 16px;
            margin-bottom: 32px;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .contractnest {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }
        
        .contractnest:hover {

        }
        
        .familyknows {
            background: linear-gradient(135deg, #48BFA3 0%, #5FD4B5 100%);
            color: white;
        }
        
        .familyknows:hover {
            background: linear-gradient(135deg, #3aa689 0%, #4ec19f 100%);
        }
        
        .icon {
            font-size: 24px;
        }
        
        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #E2E8F0;
            color: #718096;
            font-size: 14px;
        }
        
        .footer strong {
            color: #2D3748;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .download-btn {
                padding: 16px 20px;
                font-size: 15px;

    <div class="container">

</html>
