# ============================================================
# api.vikuna.io — VaNi backend
#
# Based on the file deployed on the Main VPS (2026-08-01), with CORS added so
# vani.vikuna.io can reach the auth endpoints. Everything else is unchanged:
# same upstream, same TLS, same allowlist, same catch-all 404.
#
# Allowlist is per-path on purpose. One Express process serves 18 skills;
# only these reach the internet, and `location / { return 404; }` is what keeps
# the other seventeen off it. Do not widen to /api/v1/skills/.
# ============================================================

upstream vani_backend {
    server vani-backend:3001;
    keepalive 32;
}

# Origin allowlist. Empty default is deliberate — an unrecognised origin gets NO
# CORS header rather than an echoed one. With credentials in play,
# Access-Control-Allow-Origin can never be "*", so it must echo a validated
# origin, which is exactly what this map produces.
map $http_origin $cors_origin {
    default                                            "";
    "~^https://(www\.)?vikuna\.io$"                    "$http_origin";
    "~^https://vani\.vikuna\.io$"                      "$http_origin";
    # Vercel previews for the console. Confirm the project slug against a real
    # preview URL before relying on this; narrow it if the slug differs.
    "~^https://vani-app(-[a-zA-Z0-9-]+)?\.vercel\.app$" "$http_origin";
}

server {
    listen 80;
    listen [::]:80;
    server_name api.vikuna.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.vikuna.io;

    ssl_certificate     /etc/letsencrypt/live/api.vikuna.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vikuna.io/privkey.pem;

    access_log /var/log/nginx/vani_access.log;
    error_log  /var/log/nginx/vani_error.log warn;

    client_max_body_size 2m;
    proxy_connect_timeout 60s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    location = /health {
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/v1/assessment/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/skills/assessment-skill/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product-level onboarding. The console cannot enforce a lane it cannot
    # read, so these two are prerequisites for the onboarding slice — without
    # them the browser gets the 404 below and every tenant looks un-onboarded.
    location /api/v1/onboarding/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tenant profile reads. The onboarding steps WRITE through
    # /api/v1/onboarding/step (one transaction per step), so this is only needed
    # to prefill a step with what is already known.
    location /api/v1/tenant/ {
        include /etc/nginx/conf.d/vani-cors.inc;
        proxy_pass http://vani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
