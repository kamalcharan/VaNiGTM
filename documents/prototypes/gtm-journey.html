<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaNi GTM · From discovery to conversations</title><style>
:root{--bg:#f5f5ef;--paper:#fffef9;--ink:#213e34;--muted:#68766f;--line:#dce1d6;--green:#244f3d;--lime:#deeca8;--amber:#9a601d;--soft:#f6edda;font:15px 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;color:inherit;background:transparent}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #b57a31;outline-offset:4px}a{color:var(--green)}p{color:var(--muted);line-height:1.65}h1,h2,h3,p{margin-top:0}h1{font:normal clamp(34px,4vw,54px)/1.09 Georgia,serif;letter-spacing:-1.4px;margin-bottom:18px}h2{font:normal 27px/1.2 Georgia,serif}h3{font-size:17px;margin-bottom:9px}.demo{background:#1d372e;color:#dee9d4;display:flex;justify-content:space-between;align-items:center;padding:9px 28px;gap:14px;font-size:11px}.demo button{color:#deeca8;text-decoration:underline}.header{height:82px;display:flex;justify-content:space-between;align-items:center;padding:0 34px;border-bottom:1px solid var(--line);background:var(--paper)}.logo{font-size:24px;font-weight:700;letter-spacing:-1px}.logo span{font-weight:400;color:var(--muted)}.workspace{font-size:12px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1600px;margin:auto}aside{padding:34px 20px;border-right:1px solid var(--line);min-height:calc(100vh - 120px)}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:750;text-transform:uppercase;color:var(--muted);margin-bottom:13px}.nav{display:grid;gap:5px;margin:22px 0 32px}.nav button{padding:12px;text-align:left;border-radius:8px;font-size:13px;display:flex;gap:12px;align-items:center}.nav button.active{background:#e4ebd9;color:var(--green);font-weight:700}.num{font-size:11px;color:#788770}.side-note{font-size:12px;border-top:1px solid var(--line);padding-top:20px}.side-note b{color:var(--ink)}main{padding:38px clamp(22px,4vw,62px) 60px;min-width:0;max-width:1250px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;margin-bottom:30px;align-items:center}.hero p{max-width:610px;margin-bottom:0}.next{border:1px solid #cbd7b4;background:#ecf1df;padding:24px;border-radius:13px}.next h3{font-size:19px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:7px;background:var(--green);color:white;text-decoration:none;font-weight:650;font-size:13px;gap:10px}.btn.secondary{background:#edf0e7;color:var(--green)}.btn.light{background:var(--lime);color:var(--green)}.textbtn{padding:5px 0;color:var(--green);text-decoration:underline;text-underline-offset:4px;font-size:13px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:25px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}.card p{font-size:13px;margin-bottom:15px}.wide{grid-column:1/-1}.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.pill{font-size:10px;padding:5px 9px;border:1px solid #d5dec5;border-radius:30px;color:var(--green);background:#edf3e6;white-space:nowrap}.pill.warn{color:var(--amber);background:var(--soft);border-color:#e8d8b7}.pill.neutral{background:#f0f1ed;color:#6a726b;border-color:var(--line)}.findings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.finding{padding:18px;border:1px solid var(--line);border-radius:9px;background:#f8f8f2}.finding b{display:block;font-size:14px;margin:10px 0}.finding p{font-size:12px}.mini{font-size:11px;color:var(--muted);line-height:1.65}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row p{margin:5px 0 0}.section{margin:30px 0 16px}.progress{height:5px;background:#dce3d3;border-radius:10px;margin:15px 0;overflow:hidden}.progress span{height:100%;display:block;background:#668546}.dark{background:#213e34;color:white}.dark p,.dark .eyebrow{color:#c2d0c6}.dark .pill{background:#355446;color:#e3edcd;border-color:#526d5b}.empty{border:1px dashed #cdd6c6;border-radius:9px;padding:22px;margin:17px 0;background:#f6f7f0}.back{margin-bottom:24px;font-size:12px;color:var(--muted)}.detail-head{max-width:720px;margin-bottom:28px}.detail-head h1{font-size:40px}label{display:block;font-size:13px;margin:18px 0 8px;font-weight:600}input:not([type=checkbox]),select,textarea{width:100%;padding:12px;border:1px solid #cbd4c5;border-radius:6px;color:var(--ink);background:white}textarea{min-height:100px;resize:vertical}input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);flex-shrink:0}.check{display:flex;gap:12px;align-items:flex-start;font-weight:400;line-height:1.65}.note{padding:16px;border-left:3px solid #a8bc79;background:#eef2e3;font-size:13px;line-height:1.7;margin:20px 0;color:#52644e}.list{padding-left:20px;color:var(--muted);line-height:1.8;font-size:14px}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.statusline{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:25px}.dot{width:7px;height:7px;background:#608650;border-radius:50%}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#203e33;color:white;padding:14px 22px;border-radius:9px;max-width:90vw;font-size:13px;z-index:3}.scenario{width:100%;font-size:12px;margin-top:8px}.flow{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:20px 0}.flow span{background:#e9eddf;padding:7px 11px;border-radius:5px}.offer{border:1px solid #d4ddc8;border-radius:10px;padding:20px;margin:14px 0}.offer h3{margin-bottom:8px}.file{padding:25px;border:1px dashed #a6b99c;border-radius:9px;background:#f5f8ef}details{margin:16px 0}summary{cursor:pointer;font-size:13px;font-weight:650}details p{padding-top:12px}.metric{font:normal 37px Georgia,serif;margin:12px 0}.fine{font-size:11px;color:var(--muted);margin-top:20px}.reviewbar{padding-top:20px;margin-top:25px;border-top:1px solid var(--line)}@media(max-width:1000px){.layout{grid-template-columns:180px 1fr}.hero,.split{grid-template-columns:1fr}.findings{grid-template-columns:1fr}.finding{display:grid;grid-template-columns:1fr}.hero{gap:20px}}@media(max-width:680px){.demo{padding:8px 15px}.demo span{max-width:75%}.header{height:65px;padding:0 18px}.workspace{font-size:10px}.layout{display:block}aside{min-height:auto;padding:13px 15px;border-right:0;border-bottom:1px solid var(--line)}aside>.eyebrow,aside>.side-note{display:none}.nav{display:flex;overflow:auto;margin:0;gap:5px}.nav button{flex:0 0 auto;padding:10px;font-size:12px}.nav .num{display:none}.scenario-wrap{display:flex;gap:10px;align-items:center;margin-top:10px}.scenario-wrap label{margin:0;white-space:nowrap;font-size:10px}.scenario{margin:0;padding:7px}main{padding:26px 17px 45px}.grid{grid-template-columns:1fr}.card{padding:21px}.hero{margin-bottom:22px}h1{font-size:38px}.detail-head h1{font-size:34px}.row{align-items:flex-start}.row>.btn{flex-shrink:0}.cardhead{flex-wrap:wrap}.actions>.btn{flex-grow:1}.next{padding:21px}.findings{gap:10px}.statusline{font-size:11px}.wide{grid-column:auto}}
</style></head><body><div class="demo"><span><b>GTM JOURNEY PROTOTYPE</b> · Illustrative workspace. Actions stay in this browser; nothing sends.</span><button id="reset">Reset demo</button></div><header class="header"><div class="logo">VaNi <span>/ GTM</span></div><div class="workspace">NORTHSTAR LABS <span class="pill neutral">Sample workspace</span></div></header><div class="layout"><aside><div class="eyebrow">Your growth workspace</div><nav class="nav" aria-label="GTM journey" id="nav"></nav><div class="side-note"><b>From profile to conversations.</b><p>VaNi brings what it learned during onboarding. You choose the focus and approve the next move.</p></div><div class="scenario-wrap"><label for="scenario">Discovery scenario</label><select id="scenario" class="scenario"><option value="ready">Findings ready</option><option value="preparing">Still preparing</option><option value="failed">Review interrupted</option></select></div></aside><main id="main" tabindex="-1"></main></div><div id="toast" role="status" aria-live="polite" hidden></div><script>
const initial={active:false,accepted:false,offer:false,email:false,whatsapp:false,contacts:false,provider:false,knowledge:false,scenario:'ready',fixes:[],offerName:'Workflow discovery workshop'};
let state;try{state={...initial,...JSON.parse(localStorage.getItem('vani-gtm-prototype')||'{}')}}catch{state={...initial}}let page='home';let timer;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('vani-gtm-prototype',JSON.stringify(state))}catch{}}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,4000)}function btn(text,target,cls=''){return `<button class="btn ${cls}" data-go="${target}">${text}</button>`}function pill(text,warn=false){return `<span class="pill ${warn?'warn':''}">${text}</span>`}function head(k,t,p){return `<button class="back" data-go="home">← Growth overview</button><div class="detail-head"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></div>`}
const nav=[['home','Overview'],['discovery','Discovery'],['outreach','Outreach setup'],['offers','Offers'],['activate','Activation'],['audience','Audience'],['knowledge','Knowledge']];const findings=[['Search visibility','Your key pages need clearer descriptions','Two sample pages have missing meta descriptions.','Add a specific title and description that explain your product, buyer and outcome.','/solutions · /about'],['AI search readiness','Product evidence is hard to extract','The sample crawl found little readable product detail in the initial HTML.','Publish useful product explanations and factual evidence in crawlable page content. This helps access; it does not guarantee an AI citation.','/platform'],['Social previews','Shared links need a useful preview','The sample homepage has no social preview image.','Add a page title, description and preview image so shared links explain what people will open.','/']];
function discoverySummary(){if(state.scenario==='preparing')return `<div class="note"><b>Your discovery review is being prepared.</b><br>VaNi is checking your website. You can review offers and outreach setup while it works.</div>${btn('Review offers','offers','secondary')}`;if(state.scenario==='failed')return `<div class="note"><b>We could not finish the website review.</b><br>Your saved profile is available. Retry the review or continue setting up GTM.</div><button class="btn secondary" data-act="retry">Retry review · demo</button>`;return `<div class="findings">${findings.map((f,i)=>`<div class="finding">${pill(state.fixes.includes(i)?'Ready to recheck':'Action suggested',!state.fixes.includes(i))}<b>${f[0]}</b><p>${f[1]}</p><button class="textbtn" data-finding="${i}">Review action →</button></div>`).join('')}</div>`}
function home(){const done=[state.offer,state.email||state.whatsapp,state.active].filter(Boolean).length;return `<div class="statusline"><span class="dot"></span>Company context inherited from VaNi onboarding ${state.active?'· GTM active in this demo':''}</div><div class="hero"><div><div class="eyebrow">Your next chapter</div><h1>Be found.<br>Start better conversations.</h1><p>Turn what VaNi knows about your business into discovery improvements, a focused offer and an audience worth approaching.</p></div><div class="next"><div class="eyebrow">Recommended next action</div><h3>${!state.offer?'Confirm what you want to sell':!state.active?'Activate your GTM agent':!state.contacts&&!state.provider?'Bring your first audience':'Review your first audience'}</h3><p>${!state.offer?'VaNi has proposed an offer from your company context. Review it before GTM uses it.':!state.active?'Your offer is confirmed. Review how GTM will work with your data.':'Choose the companies and people you want GTM to help you understand.'}</p>${btn(!state.offer?'Review proposed offer →':!state.active?'Review & activate →':'Open audience →',!state.offer?'offers':!state.active?'activate':'audience')}</div></div><div class="grid"><section class="card wide"><div class="cardhead"><div><div class="eyebrow">01 · Get discovered</div><h2>How easily can customers find you?</h2></div>${pill(state.scenario==='ready'?'Onboarding findings':state.scenario==='preparing'?'Preparing':'Needs a retry',state.scenario==='failed')}</div><p>Search, AI discovery and shared links. Start with the findings VaNi gathered during onboarding.</p>${discoverySummary()}<p class="fine">Illustrative audit evidence · No live visibility score or ranking claim.</p></section><section class="card"><div class="cardhead"><div class="eyebrow">02 · Reach customers</div>${pill(state.email||state.whatsapp?'Setup saved in demo':'Setup needed',!state.email&&!state.whatsapp)}</div><h2>Choose your outreach channels</h2><p>Connect your business identity. Review channel requirements before you prepare an outreach plan.</p><div class="row"><span>Email</span><span class="mini">${state.email?'Configured · demo':'Not connected'}</span></div><div class="row"><span>WhatsApp Business</span><span class="mini">${state.whatsapp?'Configured · demo':'Not connected'}</span></div>${btn('Set up outreach','outreach','secondary')}</section><section class="card"><div class="cardhead"><div class="eyebrow">03 · Review offers</div>${pill(state.offer?'Confirmed':'Proposed',!state.offer)}</div><h2>What should GTM lead with?</h2><p>${state.offer?esc(state.offerName):'A workflow discovery workshop for operations teams managing work across spreadsheets.'}</p><div class="note">${state.offer?'Your chosen offer guides company fit and message preparation.':'Read from your sample company context. Confirm the buyer, problem and first ask.'}</div>${btn(state.offer?'Review offer':'Review proposed offer','offers','secondary')} <button class="textbtn" data-go="offers">Create offers →</button></section><section class="card wide dark"><div class="cardhead"><div><div class="eyebrow">04 · Activate GTM</div><h2>${state.active?'Your GTM agent is active':'Give GTM a clear starting point'}</h2></div>${pill(state.active?'Active · demo':'Ready when you are')}</div><p>${state.active?'Your offer and acknowledgement are saved in this browser. Bring an audience to continue.':'Review your focus and acknowledge how contact data will be used. You remain in control of research and outreach decisions.'}</p>${btn(state.active?'Continue to audience →':'Review activation →',state.active?'audience':'activate','light')}<span class="mini" style="color:#c2d0c6;display:block;margin-top:14px">Activation does not send messages. Channel setup can be completed later.</span></section><section class="card"><div class="eyebrow">05 · Bring your audience</div><h2>Start with the people you know</h2><p>Import a contact list, or connect your own supported data provider account.</p>${pill(state.contacts?'6 sample contacts staged':state.provider?'Provider connected · demo':'No audience added',!state.contacts&&!state.provider)}<div class="actions">${btn('Import contacts','audience','secondary')}<button class="textbtn" data-go="provider">Connect Apollo / BYOK →</button></div></section><section class="card"><div class="eyebrow">06 · Strengthen your knowledge</div><h2>Give GTM proof to work with</h2><p>Case studies, product documents and customer outcomes help GTM explain relevance with evidence.</p>${pill(state.knowledge?'1 sample case study added':'Optional · useful anytime')}<div class="actions">${btn('Add supporting material','knowledge','secondary')}</div></section></div><div class="reviewbar"><div class="eyebrow">Your setup at a glance</div><div class="progress"><span style="width:${done/3*100}%"></span></div><p class="mini">${done} of 3 milestones complete · Offer confirmed · Outreach configured · Agent activated</p><button class="textbtn" data-go="activate">${state.accepted?'Review saved data-use acknowledgement':'Review data use & DPDP acknowledgement'}</button></div>`}
function discovery(){return head('Discovery · findings from onboarding','Make your business easier to understand.','Review the evidence, choose a fix, and recheck once your website has changed.')+`<div class="card">${state.scenario!=='ready'?discoverySummary():findings.map((f,i)=>`<section class="offer" id="finding-${i}"><div class="cardhead"><h3>${f[0]}</h3>${pill(state.fixes.includes(i)?'Ready to recheck':'Needs attention',!state.fixes.includes(i))}</div><p>${f[2]}</p><p class="mini">Sample evidence: northstarlabs.example${f[4]} · Captured during onboarding</p><div class="note"><b>Recommended action</b><br>${f[3]}</div><button class="btn secondary" data-fix="${i}">${state.fixes.includes(i)?'Undo ready-to-recheck':'Mark ready to recheck'}</button></section>`).join('')}<p class="fine">Marking an action ready does not verify a fix. A new crawl would check the updated page in the live product.</p></div>`}
function outreach(){return head('Outreach setup','Reach customers under your own identity.','Configure a channel now or come back before outreach. This prototype does not connect external accounts.')+`<div class="grid">${[['email','Email','Use your business email identity.','Connect a sender, verify the domain and confirm reply handling.'],['whatsapp','WhatsApp Business','Use your business number.','Connect your business account and number, then review template and recipient requirements.']].map(([id,t,p,n])=>`<section class="card"><div class="cardhead"><h2>${t}</h2>${pill(state[id]?'Configured · demo':'Not connected',!state[id])}</div><p>${p}</p><div class="note">${n}</div><button class="btn secondary" data-channel="${id}">${state[id]?'Reset demo connection':'Simulate completed setup'}</button></section>`).join('')}<section class="card wide"><h3>LinkedIn & other assisted outreach</h3><p>Proposed journey: review a draft, open the channel and send it yourself. Recording the outcome keeps follow-ups relevant.</p><span class="pill neutral">Design preview · no account connection</span></section></div><div class="note">Channel configured → recipient eligibility reviewed → message approved → send. Each step has its own check.</div>${btn('Review activation →','activate')}`}
function offers(){return head('Smart Profile · offers','Choose the first conversation to open.','This is the shared offer review. In the live app, edits belong to Smart Profile at /smart-profile/offers.')+`<div class="split"><form id="offer-form" class="card"><div class="cardhead"><h2>Proposed offer</h2>${pill(state.offer?'Confirmed':'Needs your review',!state.offer)}</div><label for="offer-name">Offer name</label><input id="offer-name" name="offer" required maxlength="120" value="${esc(state.offerName)}"><label for="buyer">Who is it for?</label><input id="buyer" value="Operations leaders at growing service businesses" readonly><label for="problem">What problem does it address?</label><textarea id="problem" readonly>Work scattered across spreadsheets makes handoffs difficult to track and recurring commitments easy to miss.</textarea><label for="ask">The first ask</label><input id="ask" value="A 30-minute workflow discovery conversation" readonly><div class="actions"><button class="btn" type="submit">Confirm offer & continue →</button></div></form><div><section class="card"><div class="eyebrow">Why this matters</div><h2>Give research a focus.</h2><p>GTM uses the offer to explain why a company may fit and what conversation could be relevant.</p><p class="mini">Sample proposal based on the illustrative workspace. Only the offer name is editable in this walkthrough.</p></section><div class="empty"><h3>No suitable offer?</h3><button class="textbtn" data-act="create-offer">Create offers →</button><p class="mini">CTA placeholder · /smart-profile/offers</p></div></div></div>`}
function activate(){return head('Activation · your decision','Let GTM help build your audience.','Confirm the offer and review data use. You can complete outreach setup and add evidence as you go.')+`<div class="split"><section class="card"><h2>${state.active?'Active in this demo':'Your activation summary'}</h2><div class="row"><span>Company context</span>${pill('Inherited')}</div><div class="row"><span>Offer</span>${pill(state.offer?'Confirmed':'Confirmation needed',!state.offer)}</div><div class="row"><span>Outreach channel</span>${pill(state.email||state.whatsapp?'Configured · demo':'Can complete later')}</div><div class="row"><span>Audience</span>${pill(state.contacts||state.provider?'Sample data available':'Add after activation')}</div><div class="note"><b>What activation enables</b><br>Use your confirmed offer and company knowledge to guide audience research and shortlist decisions. Messages require a separate review and approval.</div>${!state.offer?btn('Confirm your offer first','offers','secondary'):''}<div class="actions"><button class="btn" id="activate-btn" data-act="activate" ${!state.offer||!state.accepted||state.active?'disabled':''}>${state.active?'GTM activated · demo':'Activate GTM Agent →'}</button></div></section><section class="card"><div class="eyebrow">Data use · DPDP acknowledgement</div><h2>Understand what you share.</h2><p>Contact imports and provider records will be used to build and research your audience. Add only information you are authorised to share for that purpose.</p><details><summary>What this acknowledgement covers</summary><p>You are responsible for the source and permitted use of uploaded information. Recipient contact eligibility, preferences and suppression must be checked separately before outreach. This acknowledgement does not grant permission to contact every person.</p></details><label class="check"><input type="checkbox" id="ack" ${state.accepted?'checked':''} ${state.active?'disabled':''}><span>I have reviewed the proposed data-use notice and acknowledge my responsibility for the contact data I provide.</span></label><p class="fine">Prototype wording for product review; final notice, retention details and applicable terms require legal review. The live product should record the accepted version, user and time.</p>${state.accepted?'<span class="pill">Acknowledgement saved · demo only</span>':''}</section></div>`}
function audience(){return head('Audience · your starting list','Bring the relationships you want to grow.','Choose an import or use your own provider account. Review the records before adding them to your audience.')+(!state.active?`<div class="note">Activate GTM before importing contact data. You can explore the routes below now.</div>${btn('Review activation','activate')}<div class="section"></div>`:'')+`<div class="grid"><section class="card"><h2>Import your contacts</h2><p>For people and companies you already know. The live flow will map columns, identify duplicates and ask you to review conflicts.</p><label for="relationship">How do you know these contacts?</label><select id="relationship"><option>Prospects / business contacts</option><option>Existing customers</option></select><div class="file"><b>Try the import journey</b><p>Use a six-contact example to review mapping and results. No personal files are uploaded.</p><button class="btn secondary" data-go="import" ${!state.active?'disabled':''}>Use sample contact list →</button></div></section><section class="card"><h2>Connect your own provider</h2><p>Use your Apollo account or another supported provider to bring records into your workspace.</p><div class="note">Use your own key and provider allowance. Preview what will be imported before committing.</div>${btn('Explore Apollo connection','provider','secondary')}<p class="fine">Proposed integration · this prototype never asks for a real API key.</p></section>${state.contacts||state.provider?`<section class="card wide"><div class="eyebrow">Next decision</div><h2>Your sample audience is ready to review.</h2><p>Choose companies for research, see the budget, then review fit and named people. Importing a record does not mean it is qualified or eligible for contact.</p><div class="flow"><span>Companies</span>→<span>Research</span>→<span>Review fit</span>→<span>Choose people</span></div><button class="btn" data-go="shortlist">Review sample audience →</button></section>`:''}</div>`}
function importView(){return head('Import · sample walkthrough','Review before anything joins your audience.','Example file: northstar-contacts.csv · six illustrative contacts across three companies.')+`<section class="card"><h2>Suggested column mapping</h2><div class="row"><span>Full name</span><b>Person name</b></div><div class="row"><span>Organisation</span><b>Company</b></div><div class="row"><span>Work email</span><b>Email address</b></div><div class="row"><span>Company URL</span><b>Website</b></div><div class="note">6 sample rows mapped · 0 conflicting records · 2 contacts have no email address. Missing details remain visible after import.</div><label class="check"><input type="checkbox" id="import-ack"><span>I am authorised to use this list for the stated purpose. I understand that importing does not authorise outreach.</span></label><button class="btn" id="import-btn" data-act="import" disabled>Confirm sample import</button></section>`}
function provider(){return head('Audience · bring your own key','Connect the account you already use.','Provider setup is a proposed journey. No credential is collected or stored here.')+`<div class="card"><h2>Apollo</h2><p>In the live product: connect securely, check available credits, preview selected records and confirm the import.</p><div class="flow"><span>Connect</span>→<span>Check allowance</span>→<span>Preview records</span>→<span>Confirm import</span></div><div class="note">Only the records you approve should be added to this workspace. Provider access does not establish permission to send messages.</div><button class="btn" data-act="provider" ${!state.active?'disabled':''}>Simulate Apollo connection</button>${!state.active?'<p class="mini">Activate GTM first to try this demo step.</p>':''}</div>`}
function knowledge(){return head('Knowledge · evidence behind your message','Give GTM something specific to say.','Add supporting material to the shared company knowledge. You can do this before or after activation.')+`<div class="grid"><section class="card"><h2>Useful material to add</h2><ul class="list"><li>Case studies with supported customer outcomes</li><li>Product capabilities and implementation guides</li><li>Offer documents and approved proof points</li></ul><div class="file"><h3>Try a sample case study</h3><p>Northstar workflow pilot · illustrative document. No customer file is uploaded.</p><button class="btn secondary" data-act="knowledge">${state.knowledge?'View added sample':'Add sample case study'}</button></div></section><section class="card"><h2>${state.knowledge?'Evidence added to shared knowledge':'What happens next?'}</h2><p>${state.knowledge?'One illustrative case study is marked ready for use. GTM can use its supported claims when preparing research and messages.':'VaNi reads the document, identifies useful claims and makes the source available for review. You can see which material supports a proposal.'}</p>${state.knowledge?'<div class="offer"><b>Workflow pilot case study</b><p>Source: sample document<br>Status: processed in demo<br>Available to GTM: yes</p></div>':'<div class="note">Supporting knowledge is optional. Add evidence when it improves the offer or the conversation.</div>'}${btn('Back to overview','home','secondary')}</section></div>`}
function shortlist(){return head('Audience · sample result','A list to review, not a list to send.','This preview shows the handoff into company research. It does not run research or consume credits.')+`<section class="card"><h2>3 companies · 6 contacts</h2>${['Cedar Services','Fieldway Operations','Harbour Systems'].map((n,i)=>`<div class="row"><div><b>${n}</b><p>2 sample contacts · ${i===1?'email details missing':'email details available'}</p></div><span class="pill neutral">Not researched</span></div>`).join('')}<div class="note">Next in the live journey: choose companies, review research cost, then approve the research. A fit decision and contact eligibility review follow separately.</div>${btn('Back to overview','home')}</section>`}
function render(){const views={home,discovery,outreach,offers,activate,audience,import:importView,provider,knowledge,shortlist};$('#nav').innerHTML=nav.map(([id,t],i)=>`<button data-go="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="num">${String(i).padStart(2,'0')}</span>${t}</button>`).join('');$('#main').innerHTML=(views[page]||home)();$('#scenario').value=state.scenario;save()}
function go(p){page=p;render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.finding!==undefined){go('discovery');document.getElementById('finding-'+b.dataset.finding)?.scrollIntoView({block:'center'});return}if(b.dataset.fix!==undefined){const i=Number(b.dataset.fix);state.fixes=state.fixes.includes(i)?state.fixes.filter(x=>x!==i):[...state.fixes,i];render();return}if(b.dataset.channel){state[b.dataset.channel]=!state[b.dataset.channel];render();toast('Channel setup updated in demo. No external account connected.');return}switch(b.dataset.act){case'retry':state.scenario='preparing';render();toast('Review preparation simulated. Use the scenario selector to show findings ready.');break;case'create-offer':toast('Live destination: /smart-profile/offers. Use the proposed offer to continue this walkthrough.');break;case'activate':if(state.offer&&state.accepted){state.active=true;go('home');toast('GTM activated in this demo. Next: bring your audience.')}break;case'import':if(state.active&&state.accepted&&$('#import-ack')?.checked){state.contacts=true;go('audience');toast('6 sample contacts added in demo; 2 still need email details.')}break;case'provider':if(state.active){state.provider=true;go('audience');toast('Apollo connection simulated. No API key or credits used.')}break;case'knowledge':state.knowledge=true;render();toast('Sample case study added to demo knowledge.');break}});document.addEventListener('change',e=>{if(e.target.id==='ack'){state.accepted=e.target.checked;save();$('#activate-btn').disabled=!state.offer||!state.accepted||state.active}if(e.target.id==='import-ack')$('#import-btn').disabled=!e.target.checked});document.addEventListener('submit',e=>{if(e.target.id==='offer-form'){e.preventDefault();const n=$('#offer-name').value.trim();if(!n)return;state.offerName=n;state.offer=true;go('activate');toast('Offer confirmed in this demo.')}});$('#scenario').addEventListener('change',e=>{state.scenario=e.target.value;render()});$('#reset').onclick=()=>{state={...initial,fixes:[]};go('home');toast('Demo reset.');};render();
</script></body></html>
